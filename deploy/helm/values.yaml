image:
  repository: ghcr.io/galpodlipnik1/rbf-api
  tag: "8211e39"

imagePullSecrets:
  - ghcr-pull

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: rbf-api.galpodlipnik.com
  proxyBodySize: 100m

rateLimit:
  install:
    requestsPerMinute: 10
    burst: 3
  index:
    requestsPerMinute: 5
    burst: 2
